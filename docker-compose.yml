services:
  mysql:
    image: mysql:8.0
    container_name: proxy-manager-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: proxy_manager
      MYSQL_USER: proxy_user
      MYSQL_PASSWORD: proxy_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-prootpass", "--silent"]
      interval: 5s
      retries: 10

  php-fpm:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: proxy-manager-php
    volumes:
      - ./backend:/var/www
      - ./backend/storage:/var/www/storage
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: proxy_manager
      DB_USERNAME: proxy_user
      DB_PASSWORD: proxy_pass
    depends_on:
      mysql:
        condition: service_healthy

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: proxy-manager-scheduler
    volumes:
      - ./backend:/var/www
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: proxy_manager
      DB_USERNAME: proxy_user
      DB_PASSWORD: proxy_pass
    depends_on:
      mysql:
        condition: service_healthy
    command: ["php", "artisan", "schedule:work"]

  nginx:
    image: nginx:alpine
    container_name: proxy-manager-nginx
    ports:
      - "8081:80"
    volumes:
      - ./backend:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php-fpm

volumes:
  mysql_data:
